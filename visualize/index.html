<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mengine · visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <span class="logo"><strong>mengine</strong> · <em>visualizer</em></span>
      <div class="sc-btns">
        <button class="sc-btn active" data-s="gc_flat">flat GC (current)</button>
        <button class="sc-btn" data-s="gc_alt">graph GC (alt)</button>
        <button class="sc-btn" data-s="fill_simple">fill (simple)</button>
        <button class="sc-btn" data-s="fill_shared">fill (shared ?)</button>
      </div>
      <div id="prog-bar"><div id="prog-fill"></div></div>
    </header>

    <main>
      <div id="graph">
        <svg id="g" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- dim arrow heads -->
            <marker
              id="ar-ty"
              markerWidth="5"
              markerHeight="5"
              refX="5"
              refY="2"
              orient="auto"
            >
              <path d="M0,0L0,4L5,2z" fill="#6a5000" />
            </marker>
            <marker
              id="ar-ct"
              markerWidth="5"
              markerHeight="5"
              refX="5"
              refY="2"
              orient="auto"
            >
              <path d="M0,0L0,4L5,2z" fill="#1a5c2a" />
            </marker>
            <marker
              id="ar-ch"
              markerWidth="5"
              markerHeight="5"
              refX="5"
              refY="2"
              orient="auto"
            >
              <path d="M0,0L0,4L5,2z" fill="#1a3a6e" />
            </marker>
            <marker
              id="ar-nr"
              markerWidth="5"
              markerHeight="5"
              refX="5"
              refY="2"
              orient="auto"
            >
              <path d="M0,0L0,4L5,2z" fill="#3a1870" />
            </marker>
            <!-- bright arrow heads for active edge -->
            <marker
              id="ar-ty-a"
              markerWidth="7"
              markerHeight="7"
              refX="6"
              refY="2.5"
              orient="auto"
            >
              <path d="M0,0L0,5L7,2.5z" fill="#d29922" />
            </marker>
            <marker
              id="ar-ct-a"
              markerWidth="7"
              markerHeight="7"
              refX="6"
              refY="2.5"
              orient="auto"
            >
              <path d="M0,0L0,5L7,2.5z" fill="#3fb950" />
            </marker>
            <marker
              id="ar-ch-a"
              markerWidth="7"
              markerHeight="7"
              refX="6"
              refY="2.5"
              orient="auto"
            >
              <path d="M0,0L0,5L7,2.5z" fill="#79c0ff" />
            </marker>
            <marker
              id="ar-nr-a"
              markerWidth="7"
              markerHeight="7"
              refX="6"
              refY="2.5"
              orient="auto"
            >
              <path d="M0,0L0,5L7,2.5z" fill="#8957e5" />
            </marker>
            <filter id="glow-node" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="glow-edge" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="2" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <g id="g-edges-bg"></g>
          <g id="g-edge-act"></g>
          <g id="g-nodes"></g>
        </svg>
      </div>

      <div id="sidebar">
        <div id="explain">
          <div id="explain-op">ready</div>
          <div id="explain-msg">
            Press <b>▷</b> to step, or <b>▶</b> to play.
          </div>
        </div>
        <div id="sets">
          <div class="set-row">
            <span class="set-lbl">worklist</span>
            <div class="set-items" id="s-wl"><span class="p-em">—</span></div>
          </div>
          <div class="set-row">
            <span class="set-lbl">visited</span>
            <div class="set-items" id="s-vi"><span class="p-em">—</span></div>
          </div>
          <div class="set-row">
            <span class="set-lbl">collected</span>
            <div class="set-items" id="s-co"><span class="p-em">—</span></div>
          </div>
        </div>
      </div>
    </main>

    <div id="code-panel">
      <div id="code"></div>
    </div>

    <footer>
      <button class="btn" id="b-rst" title="Reset">↺</button>
      <button class="btn" id="b-prv" title="Back">◁</button>
      <button class="btn" id="b-ply" title="Play/Pause">▶</button>
      <button class="btn" id="b-nxt" title="Step forward">▷</button>
      <span id="step-ctr">— / —</span>
      <div id="legend">
        <span class="li"
          ><span class="ls" style="border-top: 1px solid #6a5000"></span
          >type</span
        >
        <span class="li"
          ><span class="ls" style="border-top: 1px dashed #1a5c2a"></span
          >context</span
        >
        <span class="li"
          ><span class="ls" style="border-top: 1px solid #1a3a6e"></span
          >child</span
        >
        <span class="li"
          ><span class="ls" style="border-top: 1px dotted #3a1870"></span
          >non-owning</span
        >
      </div>
      <div class="spd-wrap">
        speed <input type="range" id="spd" min="1" max="10" value="4" />
      </div>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
