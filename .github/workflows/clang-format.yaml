name: clang-format

on:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt update
          sudo apt install -y clang-format

      - name: Run clang-format
        run: |
          clang-format $(git ls-files '*.c') --dry-run --Werror
